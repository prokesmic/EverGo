name: E2E Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      agents:
        description: 'Test agents to run (comma-separated: atlas,hermes,nyx,iris,kronos)'
        required: false
        default: 'atlas,hermes,nyx,iris,kronos'
      base_url:
        description: 'Base URL to test against'
        required: false
        default: ''

env:
  CI: true
  TEST_BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:3000' }}
  E2E_ENABLED: 'true'
  E2E_TEST_SECRET: ${{ secrets.E2E_TEST_SECRET }}

jobs:
  # Build job - runs once with proper env validation
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: production

      # REQUIRED SECRETS for Next.js build
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

      # Prisma - needed for prisma generate
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Supabase - if imported at build time
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Strava - if referenced at build time
      STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
      STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
      STRAVA_REDIRECT_URI: ${{ secrets.STRAVA_REDIRECT_URI }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate required env (fail fast with clear message)
        run: |
          node -e "
          const required = [
            'NEXTAUTH_URL',
            'NEXTAUTH_SECRET',
            'DATABASE_URL',
            'DIRECT_URL',
          ];
          const missing = required.filter(k => !process.env[k] || String(process.env[k]).trim()==='');
          if (missing.length) {
            console.error('\\n❌ Missing GitHub Secrets / env vars for CI build:');
            missing.forEach(m => console.error('  - ' + m));
            console.error('\\nGo to: GitHub repo → Settings → Secrets and variables → Actions → New repository secret');
            process.exit(1);
          }
          console.log('✅ Required env present');
          "

      - name: Prisma generate (safe; does not touch DB)
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck || npx tsc --noEmit

      - name: Build (capture logs)
        run: |
          set -o pipefail
          npm run build 2>&1 | tee next-build.log

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            next-build.log
            npm-debug.log
          if-no-files-found: ignore

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .next
          retention-days: 1

  # Test agents run in parallel
  test-atlas:
    needs: build
    runs-on: ubuntu-latest
    if: contains(github.event.inputs.agents || 'atlas,hermes,nyx,iris,kronos', 'atlas')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .next

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Run Atlas tests
        run: npm run test:atlas
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  test-hermes:
    needs: build
    runs-on: ubuntu-latest
    if: contains(github.event.inputs.agents || 'atlas,hermes,nyx,iris,kronos', 'hermes')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .next

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Run Hermes tests
        run: npm run test:hermes
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  test-nyx:
    needs: build
    runs-on: ubuntu-latest
    if: contains(github.event.inputs.agents || 'atlas,hermes,nyx,iris,kronos', 'nyx')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .next

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Run Nyx tests
        run: npm run test:nyx
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  test-iris:
    needs: build
    runs-on: ubuntu-latest
    if: contains(github.event.inputs.agents || 'atlas,hermes,nyx,iris,kronos', 'iris')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .next

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Run Iris tests
        run: npm run test:iris
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  test-kronos:
    needs: build
    runs-on: ubuntu-latest
    if: contains(github.event.inputs.agents || 'atlas,hermes,nyx,iris,kronos', 'kronos')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .next

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Run Kronos tests
        run: npm run test:kronos
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kronos-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Summary job
  summary:
    needs: [test-atlas, test-hermes, test-nyx, test-iris, test-kronos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-results'
          merge-multiple: true

      - name: Create summary
        run: |
          echo "# E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Agent | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Atlas | ${{ needs.test-atlas.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Hermes | ${{ needs.test-hermes.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Nyx | ${{ needs.test-nyx.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Iris | ${{ needs.test-iris.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kronos | ${{ needs.test-kronos.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Check for failures
        if: |
          needs.test-atlas.result == 'failure' ||
          needs.test-hermes.result == 'failure' ||
          needs.test-nyx.result == 'failure' ||
          needs.test-iris.result == 'failure' ||
          needs.test-kronos.result == 'failure'
        run: exit 1
